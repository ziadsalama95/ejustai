name: Scrape & Ingest E-JUST Data (Cloud Pipeline)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum E-JUST pages to crawl'
        required: false
        default: '600'
  schedule:
    # Weekly refresh every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Scrape E-JUST website & extract PDFs
        run: python scripts/scrape_ejust.py --max-pages "${{ github.event.inputs.max_pages || '600' }}"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ejustai-db --remote

      - name: Embed via NVIDIA NIM & upload to Cloudflare D1 + Vectorize
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run ingest:remote
