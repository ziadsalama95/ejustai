<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="E-JUST AI — Official knowledge assistant for Egypt-Japan University of Science and Technology"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="icon" href="https://www.ejust.edu.eg/assets/img/mini.png" type="image/png"/>
<title>E-JUST AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f8fafc;
  --surface:    #ffffff;
  --surface-2:  #f1f5f9;
  --border:     #e2e8f0;
  --border-hi:  #cbd5e1;
  --tx:         #0f172a;
  --tx-2:       #475569;
  --tx-3:       #94a3b8;
  --brand:      #1d4ed8;
  --brand-hi:   #1e40af;
  --brand-soft: #eff6ff;
  --brand-ring: rgba(37, 99, 235, 0.16);
  --green:      #10b981;
  --red:        #ef4444;
  --font:       'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-ar:    'IBM Plex Sans Arabic', sans-serif;
  --mono:       'JetBrains Mono', monospace;
  --shadow-sm:  0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md:  0 6px 24px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --ease:       cubic-bezier(0.22, 1, 0.36, 1);
}

html { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--tx);
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ─── Header ─────────────────────────────────────────────────── */
header {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--tx);
}

.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--border);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.brand-logo img { width: 100%; height: 100%; object-fit: contain; }

.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.hdr-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--tx-2);
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--tx-3);
}

.status-badge.live {
  color: #065f46;
  background: #ecfdf5;
  border-color: #a7f3d0;
}

.status-badge.live .status-dot {
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

.btn-new {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s var(--ease);
}

.btn-new:hover {
  background: var(--surface-2);
  border-color: var(--border-hi);
}

.btn-new:active { transform: scale(0.97); }

/* ─── App Shell & Sidebar ───────────────────────────────────── */
.app-shell {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
}

.sidebar {
  width: 264px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  transition: width 0.22s var(--ease), transform 0.22s var(--ease), opacity 0.2s;
  z-index: 30;
}

.sidebar.collapsed {
  width: 0;
  overflow: hidden;
  border-right: none;
  opacity: 0;
}

.sidebar-hd {
  padding: 14px 14px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tx-3);
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.chat-empty {
  padding: 20px 10px;
  text-align: center;
  font-size: 12.5px;
  color: var(--tx-3);
}

.chat-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 9px 10px;
  border-radius: 9px;
  cursor: pointer;
  color: var(--tx-2);
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
}

.chat-item:hover {
  background: var(--surface-2);
  color: var(--tx);
}

.chat-item.active {
  background: var(--brand-soft);
  color: var(--brand-hi);
  font-weight: 600;
}

.chat-item-title {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-item-del {
  opacity: 0;
  border: none;
  background: transparent;
  color: var(--tx-3);
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 14px;
  line-height: 1;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
}

.chat-item:hover .chat-item-del { opacity: 1; }
.chat-item-del:hover { color: var(--red); background: #fee2e2; }

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.35);
  z-index: 25;
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--tx-2);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s var(--ease);
}

.btn-icon:hover {
  background: var(--surface-2);
  color: var(--tx);
  border-color: var(--border-hi);
}

/* ─── Main Layout ────────────────────────────────────────────── */
.main {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.scroll {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
  padding: 28px 20px 20px;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ─── Welcome Screen ─────────────────────────────────────────── */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 40px 8px 16px;
  animation: fadeUp 0.45s var(--ease) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.welcome-logo {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
}

.welcome-logo img { width: 100%; height: 100%; object-fit: contain; }

.welcome-h {
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--tx);
  margin-bottom: 8px;
}

.welcome-sub {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--tx-2);
  max-width: 480px;
  margin-bottom: 32px;
}

.prompt-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.prompt-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s var(--ease);
}

.prompt-card:hover {
  border-color: #93c5fd;
  background: var(--brand-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.prompt-card:active { transform: scale(0.99); }

.prompt-card-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.prompt-icon {
  font-size: 16px;
  flex-shrink: 0;
}

.prompt-text {
  line-height: 1.4;
}

.prompt-arrow {
  color: var(--tx-3);
  flex-shrink: 0;
  transition: transform 0.2s var(--ease), color 0.2s;
}

.prompt-card:hover .prompt-arrow {
  color: var(--brand);
  transform: translateX(2px);
}

/* ─── Chat Messages ──────────────────────────────────────────── */
.msg {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: msgIn 0.28s var(--ease) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user {
  justify-content: flex-end;
}

.av {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 4px;
  box-shadow: var(--shadow-sm);
  margin-top: 2px;
}

.av img { width: 100%; height: 100%; object-fit: contain; }

.msg-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(85%, 660px);
  min-width: 0;
}

.msg.user .msg-body {
  align-items: flex-end;
  max-width: min(80%, 540px);
}

.bubble {
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 14.5px;
  line-height: 1.65;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

.msg.user .bubble {
  background: var(--brand);
  color: #ffffff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(29, 78, 216, 0.22);
}

.msg.ai .bubble {
  background: var(--surface);
  color: var(--tx);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  box-shadow: var(--shadow-sm);
}

.bubble.ar {
  direction: rtl;
  text-align: right;
  font-family: var(--font-ar);
  line-height: 1.85;
}

.bubble.uncertain {
  border-color: #fde68a;
  background: #fffbeb;
}

/* Markdown */
.bubble h1, .bubble h2, .bubble h3 {
  font-weight: 700;
  color: var(--tx);
  margin: 12px 0 6px;
  line-height: 1.3;
}
.bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
.bubble h1 { font-size: 17px; }
.bubble h2 { font-size: 15.5px; }
.bubble h3 { font-size: 14.5px; }
.bubble p { margin: 0 0 10px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 6px 0 10px 20px; display: flex; flex-direction: column; gap: 4px; }
.bubble.ar ul, .bubble.ar ol { margin: 6px 20px 10px 0; }
.bubble strong { font-weight: 600; color: var(--tx); }
.bubble a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
.bubble a:hover { color: var(--brand-hi); }
.bubble code {
  font-family: var(--mono);
  font-size: 12.5px;
  padding: 2px 5px;
  border-radius: 5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.bubble pre {
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  overflow-x: auto;
  background: #0f172a;
  color: #f8fafc;
}
.bubble pre code { padding: 0; background: none; border: none; color: inherit; }
.bubble blockquote {
  margin: 8px 0;
  padding: 8px 12px;
  border-left: 3px solid var(--brand);
  background: var(--brand-soft);
  border-radius: 0 8px 8px 0;
  color: var(--tx-2);
}
.bubble table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
  display: block;
  overflow-x: auto;
}
.bubble th, .bubble td {
  padding: 8px 10px;
  border: 1px solid var(--border);
  text-align: left;
}
.bubble th { background: var(--surface-2); font-weight: 600; }

.tw-cursor {
  display: inline-block;
  color: var(--brand);
  margin-left: 2px;
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Sources */
.sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.src-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid #bfdbfe;
  text-decoration: none;
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.16s var(--ease);
}

.src-chip:hover {
  background: #dbeafe;
  border-color: #93c5fd;
}

/* Message Footer */
.msg-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--tx-3);
}

.ai-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.act-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--tx-2);
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.16s;
}

.act-btn:hover {
  background: var(--surface-2);
  color: var(--tx);
}

.act-btn.active {
  color: #065f46;
  background: #ecfdf5;
  border-color: #a7f3d0;
}

/* Follow-ups */
.suggestions {
  margin-left: 44px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  animation: msgIn 0.25s var(--ease) both;
}

.suggestions-hd {
  font-size: 12px;
  font-weight: 600;
  color: var(--tx-2);
}

.sug-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.sug-pill {
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--tx);
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s var(--ease);
}

.sug-pill:hover {
  border-color: #93c5fd;
  background: var(--brand-soft);
  color: var(--brand-hi);
}

.sug-pill.ar-pill { font-family: var(--font-ar); direction: rtl; }

/* Typing */
.typing-row {
  display: flex;
  gap: 12px;
  align-items: center;
  animation: msgIn 0.2s var(--ease) both;
}

.typing-bubble {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 11px 15px;
  border-radius: 14px;
  border-top-left-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.t-dots { display: flex; gap: 4px; }
.t-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--brand);
  animation: tDot 1.2s infinite;
}
.t-dot:nth-child(2) { animation-delay: 0.16s; }
.t-dot:nth-child(3) { animation-delay: 0.32s; }
@keyframes tDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
  30% { transform: translateY(-4px); opacity: 1; }
}
.t-label { font-size: 12.5px; color: var(--tx-2); }

.btn-retry {
  margin-top: 8px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #fecaca;
  background: #fef2f2;
  color: #b91c1c;
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}

/* ─── Input Dock ─────────────────────────────────────────────── */
.input-dock {
  flex-shrink: 0;
  padding: 10px 20px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 78%, rgba(248, 250, 252, 0));
}

.input-wrap {
  max-width: 760px;
  margin: 0 auto;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 10px 10px 16px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  box-shadow: var(--shadow-md);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-box:focus-within {
  border-color: var(--brand);
  box-shadow: var(--shadow-md), 0 0 0 3px var(--brand-ring);
}

.ta {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--tx);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.5;
  max-height: 140px;
  min-height: 24px;
  padding: 5px 0;
}

.ta::placeholder { color: var(--tx-3); }
.ta[dir="rtl"] { font-family: var(--font-ar); }

.btn-send {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: none;
  flex-shrink: 0;
  background: var(--brand);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.18s, transform 0.18s, opacity 0.18s;
}

.btn-send:hover:not(:disabled) {
  background: var(--brand-hi);
  transform: translateY(-1px);
}

.btn-send:disabled {
  background: #cbd5e1;
  cursor: not-allowed;
}

.btn-send svg { width: 16px; height: 16px; }
.btn-send.loading .send-icon { display: none; }
.btn-send.loading .send-spinner {
  display: block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.send-spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.disclaimer {
  margin-top: 8px;
  text-align: center;
  font-size: 11.5px;
  color: var(--tx-3);
}

/* Scroll button */
#scrollBottomBtn {
  position: fixed;
  right: 20px;
  bottom: 96px;
  z-index: 25;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--tx-2);
  box-shadow: var(--shadow-md);
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#scrollBottomBtn.show { display: flex; }

/* Toast */
#toasts {
  position: fixed;
  top: 68px;
  right: 20px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 340px;
}

.toast {
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  font-size: 13px;
  font-weight: 500;
  animation: msgIn 0.2s var(--ease) both;
}
.toast.ok { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.toast.err { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }

/* ─── Responsive ─────────────────────────────────────────────── */

  .sidebar {
    position: fixed;

<script>
const PROMPTS = [
  { icon: '🎓', text: 'What academic programs does E-JUST offer?' },
  { icon: '📋', text: 'What are the undergraduate admission requirements?' },
  { icon: '💰', text: 'Tell me about tuition fees and scholarships' },
  { icon: '🔬', text: 'What research centers and labs are at E-JUST?' },
  { icon: '📍', text: 'Where is E-JUST located and is housing available?' },
  { icon: '💻', text: 'Tell me about the Faculty of CSIT and AI programs' },
];

const API = window.location.origin;
const CHATS_KEY = 'ejust_chats_v1';
const ACTIVE_SID_KEY = 'ejust_active_sid';

let live = false;
let busy = false;
let respLang = 'en';
let chats = loadAllChats();
let sid = localStorage.getItem(ACTIVE_SID_KEY) || createChatId();
let sessionMsgs = getActiveChat()?.messages.slice() || [];
let lastSendTime = 0;

function createChatId() {
  return 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

function loadAllChats() {
  try {
    const raw = localStorage.getItem(CHATS_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function persistAllChats() {
  try {
    localStorage.setItem(CHATS_KEY, JSON.stringify(chats.slice(0, 40)));
    localStorage.setItem(ACTIVE_SID_KEY, sid);
  } catch {}
}

function getActiveChat() {
  return chats.find(c => c.id === sid);
}

function upsertActiveChat(titleOverride) {
  const now = Date.now();
  let chat = getActiveChat();
  if (!chat) {
    chat = {
      id: sid,
      title: titleOverride || 'New Chat',
      createdAt: now,
      updatedAt: now,
      messages: sessionMsgs.slice(),
    };
    chats.unshift(chat);
  } else {
    chat.messages = sessionMsgs.slice();
    chat.updatedAt = now;
    if (titleOverride) chat.title = titleOverride;
    chats = [chat, ...chats.filter(c => c.id !== sid)];
  }
  persistAllChats();
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  if (!list) return;
  list.innerHTML = '';
  const nonEmpty = chats.filter(c => c.messages && c.messages.length > 0);
  if (!nonEmpty.length) {
    const empty = mk('div', 'chat-empty');
    empty.textContent = 'No saved chats yet';
    list.appendChild(empty);
    return;
  }
  nonEmpty.forEach(c => {
    const item = mk('div', 'chat-item' + (c.id === sid ? ' active' : ''));
    const titleEl = mk('span', 'chat-item-title');
    titleEl.textContent = c.title || 'New Chat';
    titleEl.title = c.title || 'New Chat';
    const delBtn = mk('button', 'chat-item-del');
    delBtn.type = 'button';
    delBtn.textContent = '×';
    delBtn.title = 'Delete chat';
    delBtn.onclick = e => { e.stopPropagation(); deleteChat(c.id); };
    item.appendChild(titleEl);
    item.appendChild(delBtn);
    item.onclick = () => loadChat(c.id);
    list.appendChild(item);
  });
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  const shouldCollapse = typeof force === 'boolean' ? !force : !sb.classList.contains('collapsed');
  sb.classList.toggle('collapsed', shouldCollapse);
  bd.classList.toggle('show', !shouldCollapse && window.innerWidth <= 768);
}

function loadChat(chatId) {
  if (busy) return;
  const target = chats.find(c => c.id === chatId);
  if (!target) return;
  sid = target.id;
  sessionMsgs = target.messages.slice();
  localStorage.setItem(ACTIVE_SID_KEY, sid);

  const feed = document.getElementById('feed');
  const welcome = document.getElementById('welcome');
  Array.from(feed.children).forEach(c => { if (c !== welcome) c.remove(); });
  welcome.style.display = sessionMsgs.length ? 'none' : '';
  sessionMsgs.forEach(m => renderBubble(m.role, m.content, m.sources || [], m.lang, '', 'restore'));
  renderSidebar();
  if (window.innerWidth <= 768) toggleSidebar(false);
}

function deleteChat(chatId) {
  chats = chats.filter(c => c.id !== chatId);
  if (sid === chatId) {
    newChat(true);
  } else {
    persistAllChats();
    renderSidebar();
  }
}

async function maybeUpdateTitle(targetSid) {
  const chat = chats.find(c => c.id === targetSid);
  if (!chat) return;
  const turns = chat.messages.filter(m => m.role === 'assistant').length;
  if (turns !== 1 && turns % 5 !== 0) return;

  try {
    const r = await fetch(`${API}/title`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chat.messages.map(m => ({ role: m.role === 'ai' ? 'assistant' : m.role, content: m.content })),
      }),
    });
    if (!r.ok) return;
    const d = await r.json();
    if (d.title) {
      chat.title = d.title;
      persistAllChats();
      renderSidebar();
    }
  } catch {}
}

const ta = document.getElementById('ta');
const btnSend = document.getElementById('btnSend');
const scrollEl = document.getElementById('scroll');
const scrollBtn = document.getElementById('scrollBottomBtn');

function hasArabic(t) { return /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(t); }
function detectLang(t) {
  const clean = t.replace(/\s/g, '');
  if (!clean.length) return 'en';
  const ar = (clean.match(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g) || []).length;
  return ar / clean.length > 0.25 ? 'ar' : 'en';
}
function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function kill(e) { e?.parentNode?.removeChild(e); }
function scrollEnd() { scrollEl.scrollTop = scrollEl.scrollHeight; }

scrollEl.addEventListener('scroll', () => {
  const atBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120;
  scrollBtn.classList.toggle('show', !atBottom);
});

function toast(msg, type = 'info') {
  const c = document.getElementById('toasts');
  const t = mk('div', 'toast ' + type);
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => kill(t), 3500);
}

function renderPromptGrid() {
  const grid = document.getElementById('promptGrid');
  grid.innerHTML = '';
  PROMPTS.forEach(({ icon, text }) => {
    const btn = mk('button', 'prompt-card');
    btn.innerHTML = `
      <span class="prompt-card-left">
        <span class="prompt-icon">${icon}</span>
        <span class="prompt-text">${esc(text)}</span>
      </span>
      <svg class="prompt-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>`;
    btn.onclick = () => {
      if (!live || busy) return;
      ta.value = text;
      resize();
      interceptSend();
    };
    grid.appendChild(btn);
  });
}

ta.addEventListener('input', resize);
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); interceptSend(); }
});

function resize() {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  btnSend.disabled = !ta.value.trim() || !live || busy;
}

function interceptSend() {
  const q = ta.value.trim();
  if (!q || !live || busy) return;
  if (Date.now() - lastSendTime < 1000) return;
  respLang = detectLang(q);
  sendMsg(q);
}

function parseSuggestions(text) {
  const patterns = [
    /\n?---\s*\n\*\*You might also want to ask:\*\*\s*\n([\s\S]+)$/i,
    /\n?---\s*\n\*\*ممكن كمان تسأل عن:\*\*\s*\n([\s\S]+)$/,
    /\n?---\s*\n\*\*[^*]+\*\*\s*\n([\s\S]+)$/,
  ];
  for (const pat of patterns) {
    const m = text.match(pat);
    if (!m) continue;
    const main = text.slice(0, text.length - m[0].length).trim();
    const sugs = m[1].split('\n').map(l => l.replace(/^\d+[.)]\s*/, '').trim()).filter(l => l.length > 4);
    if (sugs.length) return { main, suggestions: sugs };
  }
  return { main: text, suggestions: [] };
}

function mdRender(raw) {
  let s = esc(raw);
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trimEnd()}</code></pre>`);
  s = s.replace(/((?:\|[^\n]+\|\n?){2,})/g, block => {
    const rows = block.trim().split('\n').map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    if (rows.length < 2 || !rows[1].every(c => /^:?-{2,}:?$/.test(c))) return block;
    const ths = rows[0].map(c => `<th>${c}</th>`).join('');
    const trs = rows.slice(2).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  s = s.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">');
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/^[ \t]*[-*+] (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]+?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  s = s.replace(/^\d+[.)]\s+(.+)$/gm, '<oli>$1</oli>');
  s = s.replace(/(<oli>[\s\S]+?<\/oli>\n?)+/g, m => `<ol>${m.replace(/<oli>/g,'<li>').replace(/<\/oli>/g,'</li>')}</ol>`);
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
  s = s.replace(/`([^`\n]+?)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(?<![="'])(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.split(/\n{2,}/).map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-6]|ul|ol|pre|blockquote|hr|table)/.test(b)) return b;
    return `<p>${b.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  return s;
}

function showTyping() {
  const feed = document.getElementById('feed');
  const row = mk('div', 'typing-row');
  const av = mk('div', 'av');
  av.innerHTML = '<img src="https://www.ejust.edu.eg/assets/img/mini.png" alt="E-JUST"/>';
  const bub = mk('div', 'typing-bubble');
  bub.innerHTML = `<div class="t-dots"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div><span class="t-label">Thinking…</span>`;
  row.appendChild(av); row.appendChild(bub);
  feed.appendChild(row);
  scrollEnd();
  return row;
}

function createStreamingBubble(bLang) {
  const feed = document.getElementById('feed');
  const msg = mk('div', 'msg ai');
  const av = mk('div', 'av');
  av.innerHTML = '<img src="https://www.ejust.edu.eg/assets/img/mini.png" alt="E-JUST"/>';
  const body = mk('div', 'msg-body');
  const bub = mk('div', 'bubble' + (bLang === 'ar' ? ' ar' : ''));
  const cursor = mk('span', 'tw-cursor');
  cursor.textContent = '▋';
  bub.appendChild(cursor);
  body.appendChild(bub);
  msg.appendChild(av); msg.appendChild(body);
  feed.appendChild(msg);
  scrollEnd();

  return {
    updateText(text, lang) {
      if (lang === 'ar' || hasArabic(text)) bub.classList.add('ar');
      bub.textContent = text;
      bub.appendChild(cursor);
      if (scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 180) scrollEnd();
    },
    finalize(raw, sources, lang, originalQuestion) {
      kill(msg);
      renderBubble('ai', raw, sources, lang, originalQuestion);
    },
  };
}

function renderBubble(role, raw, sources, bLang, originalQuestion, skipSaveFlag) {
  bLang = bLang || respLang;
  const feed = document.getElementById('feed');
  const isAI = role === 'ai' || role === 'assistant';
  const roleClass = isAI ? 'ai' : 'user';
  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let content = raw, suggestions = [];
  if (isAI) {
    const p = parseSuggestions(raw);
    content = p.main;
    suggestions = p.suggestions;
  }

  const msg = mk('div', 'msg ' + roleClass);
  if (isAI) {
    const av = mk('div', 'av');
    av.innerHTML = '<img src="https://www.ejust.edu.eg/assets/img/mini.png" alt="E-JUST"/>';
    msg.appendChild(av);
  }

  const body = mk('div', 'msg-body');
  const bub = mk('div', 'bubble');
  if (hasArabic(content)) bub.classList.add('ar');
  if (isAI && /don't have that information|معنديش المعلومة/i.test(content)) bub.classList.add('uncertain');
  bub.innerHTML = isAI ? mdRender(content) : esc(raw);
  body.appendChild(bub);

  if (isAI && sources && sources.length) {
    const srcs = mk('div', 'sources');
    sources.forEach((s, idx) => {
      const a = mk('a', 'src-chip');
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.title = s.title || s.url;
      a.textContent = `[${idx + 1}] ${s.title || s.url}`;
      srcs.appendChild(a);
    });
    body.appendChild(srcs);
  }

  const footer = mk('div', 'msg-footer');
  const tm = mk('span'); tm.textContent = now; footer.appendChild(tm);
  if (isAI) {
    const actions = mk('div', 'ai-actions');
    const copyBtn = mk('button', 'act-btn');
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(content).then(() => {
        copyBtn.classList.add('active');
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.classList.remove('active'); copyBtn.textContent = 'Copy'; }, 2000);
      }).catch(() => {});
    };
    const thumbBtn = mk('button', 'act-btn');
    thumbBtn.textContent = 'Helpful';
    thumbBtn.onclick = () => {
      const liked = thumbBtn.classList.toggle('active');
      fetch(`${API}/feedback`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, question: originalQuestion || '', answer: content, rating: liked ? 1 : 0 }),
      }).catch(() => {});
    };
    actions.appendChild(copyBtn);
    actions.appendChild(thumbBtn);
    footer.appendChild(actions);
  }

  body.appendChild(footer);
  msg.appendChild(body);
  feed.appendChild(msg);

  if (isAI && suggestions.length) {
    const sw = mk('div', 'suggestions');
    const hd = mk('div', 'suggestions-hd');
    hd.textContent = bLang === 'ar' ? 'ممكن كمان تسأل عن' : 'Follow-up questions';
    const list = mk('div', 'sug-list');
    suggestions.forEach(sq => {
      const p = mk('button', 'sug-pill' + (hasArabic(sq) ? ' ar-pill' : ''));
      p.textContent = sq;
      p.onclick = () => { if (live && !busy) { ta.value = sq; resize(); interceptSend(); } };
      list.appendChild(p);
    });
    sw.appendChild(hd); sw.appendChild(list);
    feed.appendChild(sw);
  }

  if (skipSaveFlag !== 'restore') {
    sessionMsgs.push({ role: isAI ? 'assistant' : 'user', content: raw, sources: sources || [], lang: bLang });
    upsertActiveChat();
    if (isAI) maybeUpdateTitle(sid);
  }
  scrollEnd();
}

function renderErrorBubble(originalQuery) {
  const feed = document.getElementById('feed');
  const msg = mk('div', 'msg ai');
  const av = mk('div', 'av');
  av.innerHTML = '<img src="https://www.ejust.edu.eg/assets/img/mini.png" alt="E-JUST"/>';
  const body = mk('div', 'msg-body');
  const bub = mk('div', 'bubble');
  bub.innerHTML = '<p style="color:#b91c1c">Something went wrong while contacting the assistant. Please try again.</p>';
  const btn = mk('button', 'btn-retry');
  btn.textContent = 'Retry';
  btn.onclick = () => { kill(msg); sendMsg(originalQuery); };
  bub.appendChild(btn);
  body.appendChild(bub);
  msg.appendChild(av); msg.appendChild(body);
  feed.appendChild(msg);
  scrollEnd();
}

async function sendMsg(q) {
  lastSendTime = Date.now();
  document.getElementById('welcome').style.display = 'none';
  ta.value = '';
  resize();
  busy = true;
  btnSend.classList.add('loading');
  btnSend.disabled = true;

  renderBubble('user', q, []);
  const tyEl = showTyping();

  try {
    const r = await fetch(`${API}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ question: q, session_id: sid, lang: respLang, stream: true }),
      signal: AbortSignal.timeout(55000),
    });

    const contentType = r.headers.get('Content-Type') || '';
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      const err = new Error(errData.error || `Error ${r.status}`);
      err.serverLogged = true;
      throw err;
    }

    if (contentType.includes('text/event-stream') && r.body) {
      kill(tyEl);
      const streamState = createStreamingBubble(respLang);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', fullAnswer = '', finalSources = [], finalLang = respLang;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() ?? '';
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) continue;
          let evt;
          try { evt = JSON.parse(t.slice(5).trim()); } catch { continue; }
          if (evt.error) { const e = new Error(evt.error); e.serverLogged = true; throw e; }
          if (evt.meta) { finalSources = evt.sources || []; finalLang = evt.lang || respLang; }
          if (evt.token) { fullAnswer += evt.token; streamState.updateText(fullAnswer, finalLang); }
          if (evt.done) { fullAnswer = evt.answer || fullAnswer; finalSources = evt.sources || finalSources; finalLang = evt.lang || finalLang; }
        }
      }
      streamState.finalize(fullAnswer, finalSources, finalLang, q);
      document.getElementById('ariaLive').textContent = fullAnswer.slice(0, 200);
    } else {
      const d = await r.json();
      if (d.error) { const e = new Error(d.error); e.serverLogged = true; throw e; }
      kill(tyEl);
      renderBubble('ai', d.answer, d.sources || [], d.lang || respLang, q);
    }
  } catch (err) {
    kill(tyEl);
    renderErrorBubble(q);
    toast(err.message || 'Request failed', 'err');
    if (!err.serverLogged) {
      fetch(`${API}/log-error`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, error: err.message || 'Client timeout/network error', question: q, route: '/ask' }),
      }).catch(() => {});
    }
  }

  busy = false;
  btnSend.classList.remove('loading');
  resize();
  ta.focus();
}

function newChat(silent) {
  if (busy) return;
  sid = createChatId();
  sessionMsgs = [];
  localStorage.setItem(ACTIVE_SID_KEY, sid);
  const feed = document.getElementById('feed');
  const welcome = document.getElementById('welcome');
  Array.from(feed.children).forEach(c => { if (c !== welcome) c.remove(); });
  welcome.style.display = '';
  renderSidebar();
  if (window.innerWidth <= 768) toggleSidebar(false);
  if (!silent) toast('Started a new chat', 'ok');
  ta.focus();
}

window.addEventListener('DOMContentLoaded', async () => {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('collapsed');
  }
  renderPromptGrid();
  renderSidebar();
  try {
    const r = await fetch(`${API}/health`, { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error();
    const h = await r.json();
    live = true;
    document.getElementById('statusBadge').className = 'status-badge live';
    document.getElementById('statusLabel').textContent = 'Online';
    ta.disabled = false;

    if (sessionMsgs.length) {
      document.getElementById('welcome').style.display = 'none';
      sessionMsgs.forEach(m => renderBubble(m.role === 'assistant' ? 'ai' : m.role, m.content, m.sources || [], m.lang, '', 'restore'));
    }
    if (h.api_key_configured === false) {
      toast('NVIDIA_API_KEY is not configured yet', 'err');
    }
    ta.focus();
  } catch {
    document.getElementById('statusLabel').textContent = 'Offline';
    toast('Could not connect to assistant API', 'err');
  }
});
</script>
